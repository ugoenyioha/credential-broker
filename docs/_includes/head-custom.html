<!-- Mermaid, themed to match the PlantUML diagrams: identity blue, monitor cream,
     credential green. Sequences render from committed source in the browser, so no
     generated diagram artifact can drift from that source. -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
      fontSize: '14px',
      primaryColor: '#EDF5EE', primaryTextColor: '#16301C', primaryBorderColor: '#4E7A57',
      lineColor: '#5A5A5A', actorBkg: '#12243A', actorTextColor: '#FFFFFF',
      actorBorder: '#12243A', signalColor: '#3A3A3A', signalTextColor: '#1A1A1A',
      labelBoxBkgColor: '#EEF3FA', labelBoxBorderColor: '#4472A8', labelTextColor: '#12243A',
      noteBkgColor: '#F7F3E8', noteBorderColor: '#B08A3E', noteTextColor: '#3A2E12',
      sequenceNumberColor: '#FFFFFF'
    },
    sequence: { diagramMarginX: 24, diagramMarginY: 16, boxMargin: 12,
                mirrorActors: false, wrap: true, width: 165 }
  });

  async function renderMermaid() {
    const blocks = document.querySelectorAll(
      'pre.mermaid, pre > code.language-mermaid, pre > code.mermaid'
    );
    for (const block of blocks) {
      const pre = block.matches('pre') ? block : block.parentElement;
      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = block.textContent;
      pre.replaceWith(diagram);
    }
    await mermaid.run({ querySelector: '.mermaid' });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMermaid, { once: true });
  } else {
    renderMermaid();
  }
</script>
