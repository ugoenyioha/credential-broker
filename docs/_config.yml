title: Brokered credential access across an inspecting boundary
description: >-
  A pattern, and a measured reference implementation, for per-user access to a
  device whose credential cannot be per-user — across a boundary that records
  everything crossing it.
theme: jekyll-theme-cayman
show_downloads: false

# Static views are committed next to their PlantUML or Python diagrams source,
# so the site needs no diagram build step. Sequences render from Mermaid blocks
# using _includes/head-custom.html.
exclude:
  - "*.puml"
  - "*.py"
