<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="654px" preserveAspectRatio="none" style="width:882px;height:654px;background:#FFFFFF;" version="1.1" viewBox="0 0 882 654" width="882px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="348.5508" x="263.2339" y="20.7803">Trust Zones &#8212; what may cross, and what may never</text></g><!--cluster HIGH--><g class="cluster" data-qualified-name="HIGH" data-source-line="17" id="ent0001"><rect fill="#EEF3FA" height="97" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:1;" width="492" x="7" y="42"/><text fill="#141413" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="106.5586" x="199.7207" y="54.7803">IDENTITY ZONE</text></g><!--cluster MID--><g class="cluster" data-qualified-name="MID" data-source-line="22" id="ent0004"><rect fill="#F7F3E8" height="127" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:1;" width="308" x="10" y="194"/><text fill="#141413" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="108.8828" x="109.5586" y="206.7803">MONITOR ZONE</text></g><!--cluster LOW--><g class="cluster" data-qualified-name="LOW" data-source-line="26" id="ent0006"><rect fill="#EDF5EE" height="228.5" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:1;" width="419" x="54" y="411.5"/><text fill="#141413" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="133" x="197" y="424.2803">CREDENTIAL ZONE</text></g><!--entity CP--><g class="entity" data-qualified-name="HIGH.CP" data-source-line="18" id="ent0002"><rect fill="#FDFDFD" height="48" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="229.3369" x="23.33" y="75"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5654" x="33.33" y="95.7803">Caller</text><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.3369" x="33.33" y="109.7803">(control plane acting for a human)</text></g><!--entity IDP--><g class="entity" data-qualified-name="HIGH.IDP" data-source-line="19" id="ent0003"><rect fill="#FDFDFD" height="34" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="121.1582" x="361.42" y="82"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.1582" x="371.42" y="102.7803">Identity Provider</text></g><!--entity MONITOR--><g class="entity" data-qualified-name="MID.MONITOR" data-source-line="23" id="ent0005"><rect fill="#FDFDFD" height="62" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="240.999" x="33.5" y="235"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2061" x="43.5" y="255.7803">Monitor &#8212; inspecting middlebox</text><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.999" x="43.5" y="269.7803">TLS terminated &#183; full packet capture</text><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.2197" x="43.5" y="283.7803">captures retained indefinitely</text></g><!--entity BR--><g class="entity" data-qualified-name="LOW.BR" data-source-line="27" id="ent0007"><rect fill="#FDFDFD" height="34" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="128.9375" x="77.53" y="452.5"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.9375" x="87.53" y="473.2803">Credential Broker</text></g><!--entity V--><g class="entity" data-qualified-name="LOW.V" data-source-line="28" id="ent0008"><rect fill="#FDFDFD" height="34" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="97.8135" x="332.09" y="452.5"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.8135" x="342.09" y="473.2803">Secret Store</text></g><!--entity T--><g class="entity" data-qualified-name="LOW.T" data-source-line="29" id="ent0009"><rect fill="#FDFDFD" height="34" rx="2.5" ry="2.5" style="stroke:#4472A8;stroke-width:0.5;" width="111.0273" x="86.49" y="582"/><text fill="#141413" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="91.0273" x="96.49" y="602.7803">Target System</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="41" id="ent0021"><path d="M345.35,202.5 L345.35,329.5 L694.6571,329.5 L694.6571,212.5 L684.6571,202.5 L345.35,202.5" fill="#FFF8E1" style="stroke:#D4C48A;stroke-width:0.5;"/><path d="M684.6571,202.5 L684.6571,212.5 L694.6571,212.5 L684.6571,202.5" fill="#FFF8E1" style="stroke:#D4C48A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="148.1162" x="351.35" y="217.5103">MAY cross this boundary:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.9272" x="358.5736" y="230.5103">&#8226; a short-lived, audience-bound access token</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="299.4063" x="358.5736" y="243.5103">&#8226; a capability bound to subject + destination + expiry</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="351.35" y="256.5103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="123.5127" x="351.35" y="269.5103">MUST NEVER cross:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="123.0684" x="358.5736" y="282.5103">&#8226; the target credential</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="201.8237" x="358.5736" y="295.5103">&#8226; a target-issued session credential</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="201.4111" x="358.5736" y="308.5103">&#8226; the broker's internal session state</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="321.0835" x="358.5736" y="321.5103">&#8226; identity asserted anywhere but inside the signed token</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="53" id="ent0024"><path d="M496.98,574.5 L496.98,623.5 L867.0186,623.5 L867.0186,584.5 L857.0186,574.5 L496.98,574.5" fill="#FFF8E1" style="stroke:#D4C48A;stroke-width:0.5;"/><path d="M857.0186,574.5 L857.0186,584.5 L867.0186,584.5 L857.0186,574.5" fill="#FFF8E1" style="stroke:#D4C48A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="316.5068" x="502.98" y="589.5103">Everything here is reachable only from inside the zone.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="349.0386" x="502.98" y="602.5103">If the boundary is compromised, the attacker holds bounded,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="325.1714" x="502.98" y="615.5103">expiring material &#8212; not a password that does not expire.</text></g><!--link CP to MONITOR--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="32" id="lnk10"><path d="M77.74,123.39 C58.24,134.93 43.55,150.58 52,170 C63.35,196.07 81.8181,215.144 102.7581,231.484" fill="none" id="CP-to-MONITOR" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="106.7,234.56,102.0654,225.8698,102.7581,231.484,97.1438,232.1768,106.7,234.56" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="139.4517" x="53" y="166.0103">short-lived access token</text></g><!--reverse link CP to MONITOR--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="37" id="lnk17"><path d="M176.1134,126.7233 C185.9534,135.3833 191.69,142.8 197,155 C208.61,181.7 194.11,212.62 178.9,234.87" fill="none" id="CP-backto-MONITOR" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="172.36,123.42,176.4735,132.3687,176.1134,126.7233,181.7588,126.3632,172.36,123.42" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="54.1963" x="201.88" y="166.0103">capability</text></g><!--link MONITOR to BR--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="33" id="lnk11"><path d="M114.67,297.25 C96.8,313.52 77.55,335.21 68,359.5 C53.78,395.69 87.0969,428.8576 113.7569,449.0876" fill="none" id="MONITOR-to-BR" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="117.74,452.11,112.9884,443.4832,113.7569,449.0876,108.1525,449.8561,117.74,452.11" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.2617" x="69" y="377.0103">token only</text></g><!--reverse link MONITOR to BR--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="36" id="lnk15"><path d="M151.9027,302.1612 C149.3327,345.3012 145,418.17 142.98,452.03" fill="none" id="MONITOR-backto-BR" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="152.2,297.17,147.6719,305.9162,151.9027,302.1612,155.6577,306.3919,152.2,297.17" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="54.1963" x="193.7999" y="370.5103">capability</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.0762" x="149.36" y="383.5103">(subject-bound, expiring)</text></g><!--link BR to V--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="34" id="lnk12"><path d="M206.68,469.5 C246.08,469.5 290.63,469.5 326.82,469.5" fill="none" id="BR-to-V" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="331.82,469.5,322.82,465.5,326.82,469.5,322.82,473.5,331.82,469.5" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="85.998" x="226.57" y="449.5103">credential read</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="89.5781" x="224.78" y="462.5103">(never crosses)</text></g><!--link BR to T--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" data-source-line="35" id="lnk13"><path d="M142,486.91 C142,511.39 142,552.21 142,576.66" fill="none" id="BR-to-T" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="142,581.66,146,572.66,142,576.66,138,572.66,142,581.66" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.6035" x="155.9873" y="527.5103">native auth</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="89.5781" x="143" y="540.5103">(never crosses)</text></g><!--link CP to IDP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="38" id="lnk19"><path d="M253.1,99 C290.16,99 329.75,99 361.28,99"